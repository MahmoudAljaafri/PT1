<style>

const SKILLS=[['SQL',95],['Excel',92],['Python',88],['Power BI',85],['Statistics',80]];
$('#sk').innerHTML=SKILLS.map(([n,v])=>`<div><span>${n}</span><em><i style="--w:${v}%"></i></em><span>${v}%</span></div>`).join('');
const rich=s=>s.replace(/\[\[(.+?)\]\]/g,'<span class="hl">$1</span>').replace(/\(\((.+?)\)\)/g,'<span class="cc">$1</span>');

/* ---------- the sheet: raw -> clean -> sorted -> chart ---------- */
// [raw name, raw region, raw revenue, clean name, clean region, clean revenue, value, duplicate]
const D=[
 ['acme  co.','north','12,4OO','Acme Co.','North','12,400',12400,0],
 ['Globex','','28100','Globex','East','28,100',28100,0],
 ['Initech','West','N/A','Initech','West','9,800',9800,0],
 ['Acme Co.','North','12400','Acme Co.','North','12,400',12400,1],
 ['Umbrella','south','17250','Umbrella','South','17,250',17250,0],
 ['Hooli','East','21,9OO','Hooli','East','21,900',21900,0]];
const order=D.map((r,i)=>i).sort((a,b)=>(D[a][7]-D[b][7])||(D[b][6]-D[a][6]));
const pos=[];order.forEach((id,k)=>{pos[id]=k;});
const top=order.filter(i=>!D[i][7]),max=D[top[0]][6];
const trs=$('#trs');
trs.innerHTML=D.map((r,i)=>`<div class="tr${r[7]?' dup':''}"><span class="rn">${i+1}</span><div class="c"><span></span></div><div class="c"><span></span></div><div class="c"><i class="db"></i><span></span></div></div>`).join('');
const TR=$$('.tr',trs);
const chb=$('#chb');
top.forEach(i=>{const b=document.createElement('div');b.className='bc';b.innerHTML=`<i></i><span>${D[i][3]}</span>`;chb.appendChild(b);});
const BC=$$('.bc i',chb),cl=$('.cl',chb);
let cleaned=null;
const pin=$('#how'),stick=$('.stick'),caps=$$('.cap'),fxt=$('#fxt');
if(RM)pin.classList.add('static');
const ez=t=>t*t*(3-2*t);
const FX=['=IMPORT(sources)','=CLEAN(A1:C6)','=SORT(revenue, DESC)','=CHART(top_customers)'];
let raf=0,pcur=0;

function setCells(clean,flash){
 TR.forEach((tr,i)=>{const r=D[i],cs=$$('.c',tr);
  [0,1,2].forEach(k=>{const v=clean?r[3+k]:r[k],c=cs[k];c.firstElementChild.textContent=v||'';
   const bad=!clean&&(!v||v==='N/A'||/O/.test(v)||v!==v.trim()||v===v.toLowerCase()&&k<2);
   c.classList.toggle('bad',!!bad);
   if(flash&&r[k]!==r[3+k]){c.classList.remove('fix');void c.offsetWidth;c.classList.add('fix');}});});}

function frame(){
 raf=0;let busy=false;
 const off=parseFloat(getComputedStyle(stick).top)||56,total=Math.max(1,pin.offsetHeight-stick.offsetHeight);
 const t=RM?1:clamp((off-pin.getBoundingClientRect().top)/total,0,1),d=t-pcur;
 if(Math.abs(d)>.0008){pcur+=d*.14;busy=true;}else pcur=t;
 const P=RM?1:pcur,isClean=P>=.27;
 if(cleaned!==isClean){setCells(isClean,cleaned!==null&&isClean);cleaned=isClean;}
 const t1=clamp((P-.27)/.1,0,1),t2=ez(clamp((P-.52)/.2,0,1)),t3=ez(clamp((P-.76)/.2,0,1));
 TR.forEach((tr,i)=>{const h=tr.offsetHeight;tr.style.transform=`translateY(${(pos[i]-i)*h*t2}px)`;
  tr.classList.toggle('x',t1>.5);
  $('.db',tr).style.width=(D[i][7]?0:D[i][6]/max*100*t2)+'%';});
 top.forEach((id,k)=>{BC[k].style.height=(D[id][6]/max*100*t3)+'%';});
 cl.style.opacity=t3;
 const act=Math.min(3,Math.floor(Math.min(P,.9999)*4));caps.forEach((c,i)=>c.classList.toggle('on',i===act));
 if(pin.getBoundingClientRect().top<innerHeight*.5&&pin.getBoundingClientRect().bottom>innerHeight*.4)fxt.textContent=FX[act];else fxt.textContent='=HELLO()';
 if(busy)kick();
}
function kick(){if(!raf)raf=requestAnimationFrame(frame);}

/* ---------- language ---------- */
function apply(){const d=T[S.lang];root.lang=S.lang;root.dir=S.lang==='ar'?'rtl':'ltr';
 $$('[data-i18n]').forEach(el=>{el.innerHTML=rich(d[el.dataset.i18n]||'');});
 $('#h1').innerHTML=`<span class="l1">${d.name[0]}</span><span class="l2">${d.name[1]}</span>`;
 $('#lang').textContent=S.lang==='ar'?'EN':'عربي';document.title=d.logo;kick();}
$('#lang').addEventListener('click',()=>{S.lang=S.lang==='ar'?'en':'ar';try{localStorage.setItem('pf-lang',S.lang);}catch(e){}apply();});
apply();

/* ---------- reveal, scroll, copy ---------- */
if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.15});$$('.rv').forEach(el=>io.observe(el));}else $$('.rv').forEach(el=>el.classList.add('in'));
addEventListener('scroll',kick,{passive:true});addEventListener('resize',kick);
$('#copy').addEventListener('click',async()=>{const el=$('#mail'),lab=$('#copyL');let m='c_done';
 try{await navigator.clipboard.writeText(el.textContent);}catch(e){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);m='c_sel';}
 lab.textContent=T[S.lang][m];setTimeout(()=>{lab.textContent=T[S.lang].c_copy;},1900);});
})();
</script>
